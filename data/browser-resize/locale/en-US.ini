Size.AnchorTip="While the size changes the page is drawn at its own scale, pinned to this point of the frame, so text does not stretch. For a chat that grows from the bottom left, pick Bottom left."
Size.Redraw="Redraw the page all the time"
Size.RedrawTip="Without it a static page, such as a chat between messages, may not show its new size, mostly with browser hardware acceleration. Adds an invisible animation to the end of the source's custom CSS, between marks; your own CSS stays as it is. The page reloads once when you switch this."
Size.FixedHeight="Hold page height during Move"
Size.FixedHeightTip="While Move runs, the page keeps the larger of the start and end heights, so a chat pinned to the bottom does not reflow on every step. When the move ends, the page gets its scene's exact size. For chats anchored at the bottom."
Size.SmoothMove="Smooth resize (for Move)"
Size.SmoothMoveTip="On: the page resizes along with the Move animation. Turn it off for Fade and other transitions: the old and the new scene then each show the page at its own size."
