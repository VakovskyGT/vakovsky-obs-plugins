Size.AnchorTip="Пока размер меняется, страница рисуется в своём масштабе и прижата к этой точке рамки, поэтому текст не растягивается. Для чата, который растёт от левого нижнего угла, выберите «Левый нижний угол»."
Size.Redraw="Постоянная перерисовка страницы"
Size.RedrawTip="Без неё статичная страница, например чат между сообщениями, может не показать новый размер, особенно при аппаратном ускорении браузера. Добавляет в конец пользовательского CSS источника невидимую анимацию между метками, ваш CSS не меняется. При переключении страница один раз перезагрузится."
Size.FixedHeight="Стабильная высота на время Move"
Size.FixedHeightTip="Пока идёт Move, страница держит бо́льшую из начальной и конечной высот, чтобы прижатый к низу чат не перестраивался на каждом шаге. Когда движение закончится, страница получает точный размер своей сцены. Для чатов с привязкой снизу."
Size.SmoothMove="Плавное изменение размера (для Move)"
Size.SmoothMoveTip="Включено: размер страницы меняется вместе с анимацией Move. Для затухания и других переходов выключите: тогда старая и новая сцены показывают страницу каждая в своём размере."
